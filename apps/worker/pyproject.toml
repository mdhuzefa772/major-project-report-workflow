[project]
name = "worker"
version = "0.1.0"
description = "Worker for the Major Project Technical Seminar report workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "mistralai>=3.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
